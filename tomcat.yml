---
- name: Setting_up Tomcat
  hosts: all
  become: yes

  vars:
    user: tomcat
    group: tomcat
    dir: /opt/tomcat
    archive: /tmp/apache-tomcat.tar.gz

  tasks:

    - name: Installing Java
      yum:
        name: java-21-amazon-corretto
        state: present

    - name: Creating group for Tomcat
      group:
        name: "{{ group }}"
        state: present

    - name: Creating User
      user:
        name: "{{ user }}"
        group: "{{ group }}"
        system: yes
        shell: /sbin/nologin
        create_home: yes
        state: present

    - name: Creating Dir for Tomcat
      file:
        path: "{{ dir }}"
        state: directory
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: "0755"

    - name: Download Tomcat Archive
      get_url:
        url: https://dlcdn.apache.org/tomcat/tomcat-11/v11.0.25/bin/apache-tomcat-11.0.25.tar.gz
        dest: "{{ archive }}"

    - name: Extracting file
      unarchive:
        src: "{{ archive }}"
        dest: "{{ dir }}"
        remote_src: yes
        extra_opts:
          - "--strip-components=1"
        owner: "{{ user }}"
        group: "{{ group }}"
        creates: "{{ dir }}/bin/catalina.sh"

    - name: Creating tomcat-user
      copy:
        dest: "{{ dir }}/conf/tomcat-users.xml"
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: "0600"
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <tomcat-users xmlns="http://tomcat.apache.org/xml"
                        xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                        xsi:schemaLocation="http://tomcat.apache.org/xml tomcat-users.xsd"
                        version="1.0">

            <role rolename="manager-gui"/>
            <role rolename="manager-script"/>

            <user username="tomcat"
                  password="tomcat123"
                  roles="manager-gui,manager-script"/>

          </tomcat-users>
      notify: Restart Tomcat

    - name: Removing those lines from context.xml
      replace:
        path: "{{ dir }}/webapps/manager/META-INF/context.xml"
        regexp: '(?s)<Valve\s+className="org\.apache\.catalina\.valves\.RemoteAddrValve".*?/>'
        replace: ''
      notify: Restart Tomcat

    - name: Creating Tomcat service
      copy:
        dest: /etc/systemd/system/tomcat.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Apache Tomcat
          After=network.target

          [Service]
          Type=forking

          User={{ user }}
          Group={{ group }}

          Environment="JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto"
          Environment="CATALINA_HOME={{ dir }}"
          Environment="CATALINA_BASE={{ dir }}"

          ExecStart={{ dir }}/bin/startup.sh
          ExecStop={{ dir }}/bin/shutdown.sh

          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart Tomcat

    - name: Start Tomcat service
      service:
        name: tomcat
        state: started
        enabled: yes

  handlers:

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart Tomcat
      systemd:
        name: tomcat
        state: restarted
